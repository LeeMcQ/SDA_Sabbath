<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161c28">
<meta name="description" content="Selah — offline church presenter for SDA media teams: Bible, hymns, slides, video, web and screen sharing on a second screen.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Selah">
<title>Selah presenter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/ahn-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply theme before first paint to avoid a flash.
  try { var s = JSON.parse(localStorage.getItem('selah.settings.v1') || '{}'); var a = s.app || {};
    document.documentElement.setAttribute('data-theme', a.theme || 'dark');
    if (a.monitors === false) document.documentElement.classList.add('no-mon'); } catch (e) {}
</script>
</head>
<body class="app" id="app">
<header class="topbar">
  <h1 class="brand"><img src="icons/icon-192.png" alt="" width="30" height="30"><span>Selah</span></h1>
  <button class="disp-btn" id="dispBtn" type="button" title="Choose where to present"><span class="dot"></span><span class="lbl">No display</span></button>
  <div class="quick" id="quick" role="search">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/></svg>
    <input id="quickInput" type="search" autocomplete="off" spellcheck="false" placeholder="Go to… John 3:16 or hymn 73   ( / )" aria-label="Quick go to: Bible reference or hymn number">
    <div class="quick-pop" id="quickPop" role="listbox" hidden></div>
  </div>
  <div class="spacer"></div>
  <div class="top-icons" id="topIcons"></div>
  <button class="present empty" id="presentBtn" type="button" title="Present the selected item (F5 or Ctrl+Enter)">
    <svg class="i pi" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="1.5"/><path d="m10 7.5 4.5 2.5-4.5 2.5z"/><path d="M8 21h8M12 16.5V21"/></svg>
    <span class="pk">Present</span><kbd>F5</kbd>
    <span class="pn" id="presentNext">Nothing selected</span>
  </button>
</header>
<nav class="rail-nav" aria-label="Media"><div class="rail" id="rail" role="tablist" aria-label="Media"></div></nav>
<main class="work" id="work"></main>
<aside class="monitors" id="monitors" aria-label="Next and live"></aside>
<footer class="ctrlbar" id="ctrlbar" hidden></footer>
<noscript><p style="padding:24px">Selah needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
