# Shared Hymns robot: checks songs shared from SDA Sabbath in any language (issues made with the "Share a hymn"
# form), and publishes them to every church with that language once the maintainer adds the label "chorus-approved".
# Set the repository variable AUTO_PUBLISH_CHORUSES to "true" to publish choruses that pass every check
# without waiting for approval.
name: Chorus robot

on:
  issues:
    types: [opened, edited, labeled]

permissions: {}   # nothing by default; the job below gets only what it needs

concurrency:
  group: chorus-robot
  cancel-in-progress: false

jobs:
  chorus:
    if: contains(github.event.issue.labels.*.name, 'chorus') || startsWith(github.event.issue.title, 'Chorus:') || startsWith(github.event.issue.title, 'Hymn:')
    permissions:
      contents: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Check (and publish) the chorus
        run: python tools/chorus_bot.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH_CHORUSES }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # songs sent from the app: their MIDI, and the answer to the church
