<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Selah display</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/stage.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #root { position: fixed; inset: 0; cursor: none; }
  .disp-hint { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); z-index: 50; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center;
    padding: 16px 22px; border-radius: 12px; background: #1b2230; color: #e9e4d8; border: 1px solid #36435c;
    font: 16px/1.4 Hyperlegible, system-ui, sans-serif; }
  .disp-hint b { font-size: 18px; }
  .disp-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6f7a8e;
    font: 18px/1.4 Hyperlegible, system-ui, sans-serif; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="js/display-main.js"></script>
</body>
</html>
